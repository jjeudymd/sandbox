<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar Parser to CSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-3xl mx-auto my-12 p-8 bg-white rounded-lg shadow-lg">
    <h2 class="text-3xl font-bold mb-6 text-blue-700">Calendar HTML to CSV Converter</h2>
    <div class="mb-6">
      <label for="sectionSelect" class="font-semibold text-gray-800 mr-2">Section:</label>
      <select id="sectionSelect" class="border rounded px-2 py-1 focus:outline-none focus:ring bg-gray-100">
        <option>Body</option>
        <option>Chest</option>
        <option>MSK</option>
        <option>Neuro</option>
        <option>Peds</option>
        <option>Nucs</option>
        <option>ED</option>
        <option>Mammo</option>
        <option>VIR</option>
      </select>
    </div>
    <div class="mb-6">
      <label class="block text-lg mb-2 font-semibold text-gray-700">Paste Calendar Code or Upload HTML File</label>
      <textarea id="inputText" rows="8" class="block w-full border rounded-lg mb-2 p-3 bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Paste your HTML code here"></textarea>
      <input type="file" id="fileInput" class="block mt-2"/>
    </div>
    <div class="mb-6 flex flex-wrap gap-4 items-end">
      <button onclick="parseToCSV()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-semibold shadow transition w-full sm:w-auto">Parse to CSV</button>
      <div class="flex flex-col">
        <label for="filenameInput" class="font-semibold text-gray-700 mb-1">CSV Filename</label>
        <input id="filenameInput" type="text" value="calendar.csv" class="border rounded px-2 py-1 bg-gray-100 focus:outline-none focus:ring w-full sm:w-40"/>
      </div>
      <button onclick="downloadCSV()" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 font-semibold shadow transition w-full sm:w-auto">Download CSV</button>
    </div>
    <div id="status" class="mb-4 text-red-500 font-medium"></div>
    <label class="block text-lg mb-2 font-semibold text-gray-700">CSV Preview</label>
    <textarea id="csvOutput" rows="12" class="block w-full border rounded-lg p-3 bg-gray-100 overflow-auto mb-6" readonly></textarea>
  </div>
  <script>
    let csvData = "";
    function setStatus(msg, success = false) {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.className = success ? "mb-4 text-green-600 font-medium" : "mb-4 text-red-500 font-medium";
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      setStatus("");
      const file = e.target.files[0];
      if (!file) return setStatus("No file selected.");
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('inputText').value = event.target.result;
        setStatus("File loaded, ready to parse.", true);
      };
      reader.onerror = function() {
        setStatus("Error reading file.");
      }
      reader.readAsText(file);
    });

    function parseToCSV() {
      setStatus("");
      try {
        const section = document.getElementById('sectionSelect').value;
        const text = document.getElementById('inputText').value;
        if (!text || text.length < 100) {
          setStatus("No or too little input data. Check paste or file load.");
          return;
        }
        const output = ["Date,Section,Assignment,Personnel"];
        const dayRe = /data-test="(\d{4}-\d{2}-\d{2})"[\s\S]*?<table[\s\S]*?<\/table>/g;
        let dayMatch;
        let found = 0;
        while ((dayMatch = dayRe.exec(text))) {
          const day = dayMatch[1];
          const block = dayMatch[0];
          const trRe = /<tr[\s\S]*?<\/tr>/g;
          let trMatch;
          while ((trMatch = trRe.exec(block))) {
            const trBlock = trMatch[0];
            const assignMatch = /title="([^"]+)"/.exec(trBlock);
            const assignment = assignMatch ? assignMatch[1] : "";
            const personnelMatch = /class="calendarContainerRight[\s\S]*?<span[^>]*>([^<]+)<\/span/.exec(trBlock);
            const personnel = personnelMatch ? personnelMatch[1].trim() : "";
            if (assignment && personnel) {
              output.push(`${day},${section},${assignment},${personnel}`);
              found++;
            }
          }
        }
        if (found === 0) {
          setStatus("No calendar data found. Please check input format.");
        } else {
          setStatus(`Parsed ${found} rows. Section: ${section}`, true);
        }
        csvData = output.join('\n');
        document.getElementById('csvOutput').value = csvData;
      } catch (err) {
        setStatus("Error during parsing: " + err.message);
      }
    }

    function downloadCSV() {
      if (!csvData) {
        setStatus("No CSV data to download: parse first!");
        return;
      }
      const fileName = document.getElementById('filenameInput').value || 'calendar.csv';
      const blob = new Blob([csvData], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus(`Download started for "${fileName}".`, true);
    }
  </script>
</body>
</html>
