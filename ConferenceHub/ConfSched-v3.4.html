<!doctype html>
<!-- ============================================================
     ConfSched — Conference Hub
     Version 3.4  ·  UMB Diagnostic Radiology
     Changelog:
       3.4 — rating + comment now collected in the app; Google Form reduced to
             a single section of 3 prefilled fields (Rating, Comment, and a
             packed Details string) — user just opens and submits. Metadata
             joined with "|~|" (unpack via SPLIT). Eval modal gains a 1-5 rating
             scale and a comment box.
       3.3 — attendance location (Conference Room / Remote in building / Remote off
             site) picked in the eval modal, gates the open button, prefilled
             into the form; eval preview regrouped (Session metadata collapsed,
             prefill URL collapsed); Evaluate button narrowed with an
             "Opened ×n" indicator; schedule cache auto-expires when stale.
       3.2 — favicons restored; deep-linking (#iso/session); last-synced
             + manual refresh; copy Zoom link; modal focus trap; larger
             name-search cap; ARIA semantics tidy.
       3.1 — resident "can't find me" guest fallback (ID 777).
       3.0 — role-based identity (RES/FEL/ATT/Guest), name search,
             resident-only UserID, guest 8888, full-width Join.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-title" content="ConfSched" />
<link rel="icon" type="image/png" href="/sandbox/ConferenceHub/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/sandbox/ConferenceHub/favicon.svg" />
<link rel="shortcut icon" href="/sandbox/ConferenceHub/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/sandbox/ConferenceHub/apple-touch-icon.png" />
<title>Conference Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --umb-red:#C8102E; --umb-red-deep:#9c0c24;
    --umb-gold:#FFCD00;
    --umb-teal:#007698; --umb-teal-deep:#005a74;
    --bg:#f3f2f0; --surface:#ffffff;
    --ink:#1b1b1e; --ink-2:#5b5b62;
    --hair:#ececec; --hair-2:#f4f4f4;
    --font-display:"SF Pro Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --radius:20px; --shadow:0 8px 30px rgba(20,20,25,.07);
  }
  *{box-sizing:border-box}
  body{font-family:var(--font-body);background:var(--bg);color:var(--ink);margin:0;-webkit-font-smoothing:antialiased}

  /* Header */
  header{background:var(--umb-red);border-bottom:3px solid var(--umb-gold);color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px}
  .back-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:26px;line-height:1;font-weight:700;padding:4px 8px;display:none;border-radius:10px}
  .back-btn:focus-visible{outline:3px solid var(--umb-gold);outline-offset:2px}
  .brand{font-family:var(--font-display);flex-grow:1;font-size:.95rem;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;margin:0}
  .id-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px 6px 6px;font:600 .78rem/1 var(--font-body);cursor:pointer;white-space:nowrap}
  .id-chip:hover{background:rgba(255,255,255,.2)}
  .id-chip:focus-visible{outline:3px solid var(--umb-gold);outline-offset:2px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--umb-gold);color:var(--umb-red-deep);display:grid;place-items:center;font:800 .72rem/1 var(--font-display)}

  /* Layout */
  .container{max-width:640px;margin:0 auto;padding:18px 16px 60px}
  .greeting{font-family:var(--font-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:6px 2px 18px}
  .greeting small{display:block;font:500 .8rem/1.4 var(--font-body);color:var(--ink-2);letter-spacing:0;margin-top:4px}
  .sync-row{display:flex;align-items:center;gap:8px;margin:-8px 2px 4px;font:600 .74rem/1 var(--font-body);color:var(--ink-2)}
  .sync-row button{background:none;border:none;color:var(--umb-teal-deep);font:700 .74rem/1 var(--font-body);cursor:pointer;padding:4px 2px;text-decoration:underline}
  .sync-row button:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px;border-radius:4px}
  .sync-row.busy button{color:var(--ink-2);text-decoration:none;cursor:default}
  .version-foot{text-align:center;margin:34px 0 0;font:600 .7rem/1 var(--font-mono);color:#a7a4a1;letter-spacing:.5px}
  .eyebrow{font:800 .72rem/1 var(--font-display);letter-spacing:2.5px;text-transform:uppercase;color:var(--umb-red);margin:26px 2px 12px}

  /* Cards */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #efeeec}
  .hero{position:relative;overflow:hidden;padding:22px 22px 20px}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--umb-gold)}
  .hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .badge{font:800 .68rem/1 var(--font-display);letter-spacing:1.5px;text-transform:uppercase;background:var(--umb-gold);color:var(--umb-red-deep);padding:6px 10px;border-radius:7px}
  .badge.next{background:#eaf4f7;color:var(--umb-teal-deep)}
  .stamp{font:600 .8rem/1 var(--font-mono);color:var(--ink-2);letter-spacing:.5px}

  .segment{display:flex;background:#eef0f1;border-radius:999px;padding:4px;margin:4px 0 18px}
  .segment button{flex:1;border:none;background:none;cursor:pointer;padding:11px;border-radius:999px;font:800 .78rem/1 var(--font-display);letter-spacing:1px;color:var(--ink-2)}
  .segment button[aria-pressed="true"]{background:#fff;color:var(--umb-teal-deep);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .segment button:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}

  .lecture-title{font-family:var(--font-display);font-weight:800;font-size:1.35rem;line-height:1.25;letter-spacing:-.01em;margin:2px 0 18px;color:var(--ink)}
  .lecture-title.empty{color:var(--ink-2);font-weight:600;font-size:1.1rem}

  /* QR dominant, join full-width below */
  .join-block{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px}
  .qr-box{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:14px;display:grid;place-items:center;cursor:pointer;width:66.66%;aspect-ratio:1;max-width:340px;box-shadow:0 2px 14px rgba(20,20,25,.06)}
  .qr-box:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}
  .qr-box img,.qr-box canvas{width:100%!important;height:100%!important;display:block}

  .btn{font:800 .9rem/1 var(--font-display);letter-spacing:.3px;border:none;border-radius:12px;cursor:pointer;padding:14px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn:focus-visible{outline:3px solid var(--umb-gold);outline-offset:2px}
  .btn-join{background:var(--umb-teal);color:#fff;width:100%}
  .btn-join:hover{background:var(--umb-teal-deep)}
  .btn-copylink{background:none;border:none;color:var(--umb-teal-deep);font:700 .8rem/1 var(--font-display);cursor:pointer;padding:6px 10px;text-decoration:underline;letter-spacing:.3px}
  .btn-copylink:hover{color:var(--umb-teal)}
  .btn-copylink:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px;border-radius:6px}
  .btn-copylink.copied{color:#207a44;text-decoration:none}
  .btn-eval{background:#fff;color:var(--umb-teal-deep);border:2px solid var(--umb-teal);width:100%}
  .btn-eval:hover{background:#f4fafc}
  .eval-row{display:flex;align-items:center;gap:12px;margin-top:16px}
  .eval-row .btn-eval{width:auto;flex:0 0 63%}
  .eval-status{flex:1;text-align:center;font:800 .72rem/1 var(--font-display);letter-spacing:.5px;padding:9px 8px;border-radius:999px;text-transform:uppercase}
  .eval-status.no{background:#f0eeec;color:var(--ink-2)}
  .eval-status.yes{background:#e8f7ee;color:#207a44}
  /* eval modal: location picker + collapsibles */
  .loc-block{margin-bottom:18px}
  .loc-q{font:800 .82rem/1.3 var(--font-display);margin:0 0 10px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .loc-q .req{font:800 .6rem/1 var(--font-display);color:var(--umb-red);text-transform:uppercase;letter-spacing:1px}
  .loc-group{display:flex;flex-direction:column;gap:8px}
  .rate-scale{display:flex;gap:8px}
  .rate-opt{flex:1;background:#fff;border:1.5px solid #dcdad7;border-radius:11px;padding:14px 0;font:800 1.05rem/1 var(--font-display);color:var(--ink);cursor:pointer}
  .rate-opt[aria-checked="true"]{border-color:var(--umb-teal);background:var(--umb-teal);color:#fff}
  .rate-opt:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}
  .rate-anchors{display:flex;justify-content:space-between;margin-top:6px;font:600 .68rem/1 var(--font-body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
  .eval-comment{width:100%;padding:12px 14px;border:1.5px solid #dcdad7;border-radius:11px;font:500 .95rem/1.45 var(--font-body);color:var(--ink);resize:vertical;min-height:64px}
  .eval-comment:focus{outline:none;border-color:var(--umb-teal)}
  .loc-opt{text-align:left;background:#fff;border:1.5px solid #dcdad7;border-radius:11px;padding:13px 14px;font:600 .92rem/1 var(--font-body);color:var(--ink);cursor:pointer}
  .loc-opt[aria-checked="true"]{border-color:var(--umb-teal);background:#f4fafc;color:var(--umb-teal-deep);font-weight:800}
  .loc-opt:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}
  .meta-details,.url-details{margin-bottom:16px;border:1px solid var(--hair);border-radius:12px;padding:2px 12px}
  .meta-details summary,.url-details summary{cursor:pointer;font:800 .68rem/1 var(--font-display);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);padding:11px 2px;list-style:revert}
  .meta-details .map-table,.url-details .url-box{margin:0 0 12px}
  .meta-details .map-table{border:none}
  .map-v.muted{color:var(--ink-2);font-style:italic}

  .creds{border-top:1px solid var(--hair-2);margin-top:4px;padding-top:16px}
  .cred{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cred:last-child{margin-bottom:0}
  .cred-label{font:800 .66rem/1 var(--font-display);letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-2);width:78px;flex-shrink:0}
  .cred-val{font:600 .92rem/1 var(--font-mono);color:var(--ink);flex-grow:1;word-break:break-all}
  .copy{background:#f1f3f4;border:none;border-radius:8px;cursor:pointer;font:700 .68rem/1 var(--font-display);color:var(--umb-teal-deep);padding:7px 10px;flex-shrink:0;letter-spacing:.3px}
  .copy:hover{background:#e6eef1}
  .copy:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}
  .copy.copied{background:#e8f7ee;color:#207a44}

  /* Week list */
  .day-row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:16px 18px;border-bottom:1px solid var(--hair-2);font-family:inherit}
  .day-row:last-child{border-bottom:none}
  .day-row:hover{background:#faf9f8}
  .day-row:focus-visible{outline:3px solid var(--umb-teal);outline-offset:-3px;border-radius:8px}
  .day-stamp{font:700 .74rem/1.3 var(--font-mono);color:var(--umb-red);width:64px;flex-shrink:0;letter-spacing:.3px;text-align:center}
  .day-titles{flex-grow:1;overflow:hidden}
  .day-titles div{font:600 .85rem/1.4 var(--font-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-titles div span{color:var(--ink-2);font-weight:800;font-size:.68rem;letter-spacing:.5px;margin-right:6px}
  .chev{color:var(--ink-2);font-size:20px;flex-shrink:0}

  /* Status / empty */
  #status{text-align:center;color:var(--ink-2);font-weight:600;padding:80px 20px}
  .spinner{width:34px;height:34px;border-radius:50%;margin:0 auto 16px;border:3px solid #e2e0dd;border-top-color:var(--umb-red);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-hero{text-align:center;padding:30px 10px;color:var(--ink-2)}
  .empty-hero .big{font:800 1.1rem/1.3 var(--font-display);color:var(--ink);margin-bottom:4px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,20,25,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .overlay.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h2{font:800 1.2rem/1.2 var(--font-display);letter-spacing:-.01em;margin:0 0 4px}
  .sheet .sub{color:var(--ink-2);font-size:.85rem;margin:0 0 20px}

  .role-chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
  .role-chips button{border:1.5px solid #dcdad7;background:#fff;border-radius:12px;padding:13px;font:800 .82rem/1 var(--font-display);letter-spacing:.5px;color:var(--ink-2);cursor:pointer}
  .role-chips button[aria-pressed="true"]{border-color:var(--umb-teal);background:#f4fafc;color:var(--umb-teal-deep)}
  .role-chips button:focus-visible{outline:3px solid var(--umb-teal);outline-offset:2px}

  .field{margin-bottom:14px}
  .field label{display:block;font:800 .7rem/1 var(--font-display);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
  .field input{width:100%;padding:13px 14px;border:1.5px solid #dcdad7;border-radius:11px;font:500 1rem/1 var(--font-body);color:var(--ink);background:#fff}
  .field input:focus{outline:none;border-color:var(--umb-teal)}
  .row2{display:flex;gap:12px}.row2 .field{flex:1}
  .id-quick{display:flex;gap:10px;align-items:flex-end}
  .id-quick .field{flex:1;margin-bottom:0}
  .modal-btns{display:flex;gap:12px;margin-top:8px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--ink-2);font:600 .72rem/1 var(--font-body);letter-spacing:1px;margin:20px 0 14px;text-transform:uppercase}
  .divider::before,.divider::after{content:"";height:1px;background:var(--hair);flex:1}
  .btn-primary{background:var(--umb-red);color:#fff}
  .btn-primary:hover{background:var(--umb-red-deep)}
  .btn-ghost{background:#f1f3f4;color:var(--ink);flex:1}
  .btn-ghost:hover{background:#e9ebec}
  .lookup-msg{font:600 .8rem/1.4 var(--font-body);margin:10px 0 0}
  .lookup-msg.err{color:var(--umb-red)}

  .name-search{width:100%;padding:13px 14px;border:1.5px solid #dcdad7;border-radius:11px;font:500 1rem/1 var(--font-body);margin-bottom:10px}
  .name-search:focus{outline:none;border-color:var(--umb-teal)}
  .name-results{max-height:240px;overflow-y:auto;border:1px solid var(--hair);border-radius:11px}
  .name-results:empty{display:none}
  .name-item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--hair-2);padding:12px 14px;cursor:pointer;font-family:inherit}
  .name-item:last-child{border-bottom:none}
  .name-item:hover{background:#f7fbfc}
  .name-item:focus-visible{outline:3px solid var(--umb-teal);outline-offset:-3px}
  .name-item .ln{font:700 .92rem/1 var(--font-body);color:var(--ink)}
  .name-item .fn{font:500 .88rem/1 var(--font-body);color:var(--ink-2)}
  .name-empty{padding:18px;text-align:center;color:var(--ink-2);font:600 .85rem/1.4 var(--font-body)}
  .sample-note{font:600 .74rem/1.4 var(--font-body);color:#6b5600;background:#fff7db;border:1px solid #ffe27a;border-radius:9px;padding:8px 10px;margin-bottom:14px}

  .demo-note{background:#fff7db;border:1px solid #ffe27a;border-radius:12px;padding:12px 14px;font:600 .8rem/1.45 var(--font-body);color:#6b5600;margin-bottom:18px}
  .map-table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .map-row{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair-2);align-items:baseline}
  .map-row:last-child{border-bottom:none}
  .map-row:nth-child(odd){background:#fbfaf9}
  .map-k{font:800 .64rem/1.3 var(--font-display);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);width:118px;flex-shrink:0}
  .map-v{font:600 .82rem/1.35 var(--font-mono);color:var(--ink);word-break:break-word;flex-grow:1}
  .map-v.user{color:var(--umb-teal-deep);font-family:var(--font-body);font-weight:700}
  .url-box{font:500 .72rem/1.5 var(--font-mono);background:#f6f5f3;border:1px solid var(--hair);border-radius:10px;padding:12px;word-break:break-all;color:var(--ink-2);margin-bottom:16px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:420px){.qr-box{width:74%}.role-chips{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <header>
    <button id="backBtn" class="back-btn" onclick="showHome()" aria-label="Back to schedule">←</button>
    <h1 class="brand">Conference Hub</h1>
    <button id="idChip" class="id-chip" onclick="openIdentity()" aria-label="Set your identity">
      <span class="avatar" id="avatar">?</span>
      <span id="idChipLabel">Set ID</span>
    </button>
  </header>

  <div class="container">
    <div id="status" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      Loading this week&rsquo;s schedule&hellip;
    </div>

    <div id="homeView" style="display:none">
      <p class="greeting" id="greeting" aria-live="polite"></p>
      <div class="sync-row" id="syncRow" style="display:none">
        <span id="syncLabel"></span>
        <button id="refreshBtn" type="button" onclick="refreshSchedule()">Refresh</button>
      </div>
      <div id="heroSlot"></div>
      <p class="eyebrow" id="weekEyebrow" style="display:none">The rest of this week</p>
      <div class="card" id="weekList" style="display:none"></div>
      <p class="version-foot" id="versionFoot"></p>
    </div>

    <div id="detailView" style="display:none">
      <div class="card hero" id="detailHero"></div>
    </div>
  </div>

  <!-- IDENTITY MODAL -->
  <div class="overlay" id="idOverlay" role="dialog" aria-modal="true" aria-labelledby="idTitle">
    <div class="sheet">
      <h2 id="idTitle">Who&rsquo;s attending?</h2>
      <p class="sub" id="idSub">Set your identity once to submit evaluations. Stored on this device only.</p>
      <div class="role-chips" role="group" aria-label="Role">
        <button data-role="RES" aria-pressed="false" onclick="chooseRole('RES')">Resident</button>
        <button data-role="FEL" aria-pressed="false" onclick="chooseRole('FEL')">Fellow</button>
        <button data-role="ATT" aria-pressed="false" onclick="chooseRole('ATT')">Attending</button>
        <button data-role="GUEST" aria-pressed="false" onclick="chooseRole('GUEST')">Guest</button>
      </div>
      <div id="idBody"><p class="name-empty">Pick your role to continue.</p></div>
    </div>
  </div>

  <!-- EVAL MODAL -->
  <div class="overlay" id="evalOverlay" role="dialog" aria-modal="true" aria-labelledby="evalTitle">
    <div class="sheet">
      <h2 id="evalTitle">Evaluate session</h2>
      <p class="sub" id="evalSub"></p>
      <div id="evalBody"></div>
    </div>
  </div>

<script>
/* ============================================================================
   CONFIG — the block you edit when the Google Form exists (roster is already wired).
   ============================================================================ */
const CONFIG = {
  schedule: {
    sheetId: "1gNy8iWiCZ8t-A_CYoIfBCJqJUrqwiByhzJ0-e0df9as",
    gid: "0",
    col: { date:0, am:2, pm:4 }
  },

  // Roster: UMRAD26 — columns A=USERID, B=Last, C=First, D=Role.
  // Sheet must be shared "Anyone with the link – Viewer" (or Published to web)
  // for the browser gviz fetch to work. If unreachable, the built-in sample is used.
  roster: {
    sheetId: "1Z205APh5LgeM-Qo0cNlEnK7B4O89CtSnEdIhOqKBVt0",
    gid: "0",
    col: { id:0, last:1, first:2, role:3 }
  },

  // Evaluation Google Form — packed single-section design (3.4).
  // Rating & comment are collected in the app; everything else is joined into
  // one "Details" field. Reduce the form to 3 fields: Rating, Comment, Details.
  //   -> Keep your existing Rating & Comment questions (IDs below are unchanged).
  //   -> Delete the other 10 questions, add ONE short-answer "Details" question,
  //      then replace entry.DETAILS_TODO with its real entry id (prefilled link).
  eval: {
    formBase: "https://docs.google.com/forms/d/e/1FAIpQLSeTgdVcy5QfCFTpfe0UnwtzPuHsp9z0pE5JUw1edNQRBwfi2Q/viewform",
    entry: {
      rating:  "entry.1032493625",   // existing Rating question
      comment: "entry.685893802",    // existing Comment question
      details: "entry.DETAILS_TODO"  // NEW packed field — paste its entry id here
    }
  },

  // The packed "Details" string: these fields, in this order, joined by packDelim.
  // Unpack in the responses sheet with:  =SPLIT(<DetailsCell>, "|~|", FALSE)
  //   columns -> name, role, location, title, date, session, sessionKey,
  //              identityType, evaluatorId, device
  packOrder: ["name","role","location","title","date","session","sessionKey","identityType","evaluatorId","device"],
  packDelim: "|~|",   // multi-char so sessionKey's internal "|" survives the split

  // Attendance location options. These are the ONE prefilled multiple-choice
  // field, so these strings must EXACTLY match the Form's option text
  // (the eval-form-template.gs generator uses this same list).
  locations: ["Conference Room", "Remote in building", "Remote off site"],

  guestId: "8888",
  residentGuestId: "777",   // resident who can't be matched, falls back to guest

  // Fallback sample (real names from UMRAD26) — used only if the roster sheet can't be read.
  demoRoster: [
    { id:"2701", last:"Aldahmashi", first:"Ali",     role:"RES" },
    { id:"2703", last:"Belkin",     first:"Michael", role:"RES" },
    { id:"2801", last:"Chirico",    first:"Joseph",  role:"RES" },
    { id:"2905", last:"Kim",        first:"Minhee",  role:"RES" },
    { id:"99",   last:"Jeudy",      first:"Jean",    role:"ATT" },
    { id:"99",   last:"Siegel",     first:"Eliot L.",role:"ATT" },
    { id:"99",   last:"Awan",       first:"Omer",    role:"ATT" },
    { id:"99",   last:"Doo",        first:"Florence",role:"ATT" }
  ]
};

const ROLE_LABEL = { RES:"Resident", FEL:"Fellow", ATT:"Attending", GUEST:"Guest" };
const APP_VERSION = "3.4";

/* device-safe storage */
const store = (() => {
  let mem={}, ok=true;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ ok=false; }
  return {
    get:(k)=>{ try{ return ok?localStorage.getItem(k):(mem[k]??null); }catch(e){ return mem[k]??null; } },
    set:(k,v)=>{ try{ ok?localStorage.setItem(k,v):(mem[k]=v); }catch(e){ mem[k]=v; } }
  };
})();

const DEVICE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "Mobile" : "Desktop";
const CACHE_KEY="confsched.schedule.v1", ID_KEY="confsched.identity.v3", EVAL_KEY="confsched.evals.v3";
const CACHE_STALE_MS=6*24*60*60*1000;   // ignore cached schedule older than ~6 days (weekly board)

let schedule=[], heroIndex=-1, detailIdx=0, detailSession="AM", lastFocus=null, lastSynced=null;
let identity=loadIdentity();
let roster=null, rosterIsSample=false, selectedRole=null, currentResults=[];

/* ============================ DATA ============================ */
function gvizUrl(id,gid){ return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&gid=${gid}`; }
function parseGviz(text){ return JSON.parse(text.replace(/^[^{]*\(/,"").replace(/\);?\s*$/,"")).table.rows; }
function cell(r,i){ return r.c[i] && r.c[i].v!=null ? String(r.c[i].v).trim() : ""; }
function firstToken(s){ return String(s||"").trim().split(/\s+/)[0] || ""; }

async function init(){
  const cached=readCache();
  if(cached && cached.ts && (Date.now()-cached.ts)<CACHE_STALE_MS){ schedule=cached.data; lastSynced=cached.ts; renderAll(); }
  try{
    const rows=parseGviz(await (await fetch(gvizUrl(CONFIG.schedule.sheetId,CONFIG.schedule.gid))).text());
    schedule=rows.map(mapRow).filter(Boolean);
    lastSynced=Date.now(); writeCache(schedule,lastSynced); renderAll();
  }catch(e){
    if(!schedule.length){
      document.getElementById("status").innerHTML=
        '<div class="empty-hero"><div class="big">Couldn&rsquo;t reach the schedule</div>Check your connection and try again.</div>';
    }
  }
}

async function refreshSchedule(){
  const row=document.getElementById("syncRow"), label=document.getElementById("syncLabel");
  row.classList.add("busy"); label.textContent="Refreshing…";
  try{
    const rows=parseGviz(await (await fetch(gvizUrl(CONFIG.schedule.sheetId,CONFIG.schedule.gid))).text());
    schedule=rows.map(mapRow).filter(Boolean);
    lastSynced=Date.now(); writeCache(schedule,lastSynced); renderAll();
  }catch(e){
    label.textContent="Couldn't refresh — showing last saved";
  }finally{
    row.classList.remove("busy");
  }
}

function mapRow(r){
  const c=CONFIG.schedule.col, dv=r.c[c.date]?r.c[c.date].v:null;
  if(!(dv&&typeof dv==="string"&&dv.startsWith("Date"))) return null;
  const p=dv.match(/\d+/g), d=new Date(+p[0],+p[1],+p[2]);
  return {
    y:+p[0], m:+p[1], d:+p[2],
    iso:`${p[0]}-${String(+p[1]+1).padStart(2,"0")}-${String(+p[2]).padStart(2,"0")}`,
    stampFull:fmtStamp(d),
    stampShort:`${["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()]} ${String(d.getDate()).padStart(2,"0")}`,
    AM:parseContent(r.c[c.am]?r.c[c.am].v:""),
    PM:parseContent(r.c[c.pm]?r.c[c.pm].v:"")
  };
}
function fmtStamp(d){
  const days=["SUN","MON","TUE","WED","THU","FRI","SAT"], mon=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return `${days[d.getDay()]} · ${mon[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`;
}
function parseContent(text){
  if(!text||/no conference/i.test(text)) return {title:"No conference scheduled",url:"",meetingId:"",passcode:"",raw:""};
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  const um=text.match(/https?:\/\/[^\s]+/), url=um?um[0].replace(/[).,;]+$/,""):"";
  const idLine=lines.find(l=>/\bID\b|meeting id/i.test(l))||"", passLine=lines.find(l=>/passcode|password/i.test(l))||"";
  const idM=idLine.match(/([\d][\d\s]{6,})/), passM=passLine.match(/(?:passcode|password)[:\s]*([^\s|]+)/i);
  return { title:lines[0]||"Untitled session", url, meetingId:idM?idM[1].trim():"", passcode:passM?passM[1].trim():"", raw:[idLine,passLine].filter(Boolean).join("  ·  ") };
}
function readCache(){
  try{
    const v=store.get(CACHE_KEY); if(!v) return null;
    const o=JSON.parse(v);
    return Array.isArray(o) ? {data:o,ts:null} : o;   // tolerate pre-3.2 array format
  }catch(e){ return null; }
}
function writeCache(s,ts){ try{ store.set(CACHE_KEY,JSON.stringify({ts:ts||Date.now(),data:s})); }catch(e){} }

/* ============================ RENDER ============================ */
function renderAll(){
  document.getElementById("status").style.display="none";
  document.getElementById("homeView").style.display="block";
  heroIndex=pickHeroIndex(); renderGreeting(); renderSync(); renderHero(); renderWeek();
  document.getElementById("versionFoot").textContent=`ConfSched v${APP_VERSION}`;
  applyDeepLink();
}
function renderSync(){
  const row=document.getElementById("syncRow"), label=document.getElementById("syncLabel");
  if(!lastSynced){ row.style.display="none"; return; }
  row.style.display="flex";
  label.textContent="Updated "+new Date(lastSynced).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function pickHeroIndex(){
  const n=new Date(), t={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};
  let e=schedule.findIndex(s=>s.y===t.y&&s.m===t.m&&s.d===t.d);
  if(e!==-1) return e;
  const key=t.y*10000+t.m*100+t.d, nx=schedule.findIndex(s=>(s.y*10000+s.m*100+s.d)>=key);
  return nx!==-1?nx:0;
}
function isToday(i){ const n=new Date(),s=schedule[i]; return s&&s.y===n.getFullYear()&&s.m===n.getMonth()&&s.d===n.getDate(); }
function defaultSession(){ return new Date().getHours()<12?"AM":"PM"; }

function renderGreeting(){
  const g=document.getElementById("greeting");
  if(identity){
    let sub;
    if(identity.type==="guest") sub=identity.id===CONFIG.residentGuestId?"Resident · unverified":"Signed in as guest";
    else if(identity.role==="RES") sub=`Resident · ID ${escapeHtml(identity.id)}`;
    else sub=ROLE_LABEL[identity.role]||"";
    g.innerHTML=`Hi, ${escapeHtml(firstToken(identity.first))}.<small>${sub}</small>`;
  } else {
    g.innerHTML=`Welcome.<small>Set your identity to enable lecture evaluations.</small>`;
  }
}
function renderHero(){
  const slot=document.getElementById("heroSlot");
  if(!schedule.length){ slot.innerHTML=""; return; }
  const badge=isToday(heroIndex)?`<span class="badge">Today</span>`:`<span class="badge next">Next up</span>`;
  slot.innerHTML=`<div class="card hero" id="heroCard"></div>`;
  paintSession("heroCard",heroIndex,defaultSession(),badge);
}
function renderWeek(){
  const list=document.getElementById("weekList"), eb=document.getElementById("weekEyebrow");
  const others=schedule.map((_,i)=>i).filter(i=>i!==heroIndex);
  if(!others.length){ list.style.display="none"; eb.style.display="none"; return; }
  list.style.display="block"; eb.style.display="block"; list.innerHTML="";
  others.forEach(i=>{
    const day=schedule[i], b=document.createElement("button");
    b.className="day-row";
    b.setAttribute("aria-label",`${day.stampFull}. AM: ${day.AM.title}. PM: ${day.PM.title}. Open detail.`);
    b.onclick=()=>openDetail(i);
    b.innerHTML=`<div class="day-stamp">${day.stampShort}</div>
      <div class="day-titles"><div><span>AM</span>${escapeHtml(day.AM.title)}</div><div><span>PM</span>${escapeHtml(day.PM.title)}</div></div>
      <div class="chev" aria-hidden="true">›</div>`;
    list.appendChild(b);
  });
}
function paintSession(containerId,idx,session,badgeHtml){
  const day=schedule[idx], data=day[session], nOpened=openedCount(day.iso,session);
  const creds=[];
  if(data.meetingId) creds.push(credRow("ID",data.meetingId));
  if(data.passcode)  creds.push(credRow("Passcode",data.passcode));
  if(!creds.length&&data.raw) creds.push(`<div class="cred"><span class="cred-val">${escapeHtml(data.raw)}</span></div>`);
  const hasLink=!!data.url;
  document.getElementById(containerId).innerHTML=`
    <div class="hero-top">${badgeHtml||""}<span class="stamp">${day.stampFull} · ${session}</span></div>
    <div class="segment" role="group" aria-label="Session">
      <button aria-pressed="${session==='AM'}" onclick="switchSession('${containerId}',${idx},'AM')">AM</button>
      <button aria-pressed="${session==='PM'}" onclick="switchSession('${containerId}',${idx},'PM')">PM</button>
    </div>
    <h2 class="lecture-title ${data.title.startsWith('No conference')?'empty':''}" tabindex="-1" id="${containerId}-title">${escapeHtml(data.title)}</h2>
    ${hasLink?`
      <div class="join-block">
        <div class="qr-box" id="${containerId}-qr" aria-hidden="true"></div>
        <a class="btn btn-join" href="${escapeAttr(data.url)}" target="_blank" rel="noopener">Join Zoom ↗</a>
        <button class="btn-copylink" onclick="copyVal(this,'${escapeAttr(data.url)}')">Copy link</button>
      </div>
      ${creds.length?`<div class="creds">${creds.join("")}</div>`:""}
      <div class="eval-row">
        <button class="btn btn-eval" onclick="startEval(${idx},'${session}')">Evaluate this session</button>
        <span class="eval-status ${nOpened?'yes':'no'}" aria-label="${nOpened?`Form opened ${nOpened} times`:'Not yet opened'}">${nOpened?`Opened ×${nOpened}`:'NO'}</span>
      </div>`:`<div class="empty-hero">Nothing to join for this session.</div>`}`;
  if(hasLink){
    const box=document.getElementById(`${containerId}-qr`);
    box.innerHTML="";
    new QRCode(box,{text:data.url,width:420,height:420,correctLevel:QRCode.CorrectLevel.M});
    box.style.cursor="pointer";
    box.onclick=()=>window.open(data.url,"_blank","noopener");
  }
}
function credRow(label,val){
  return `<div class="cred"><span class="cred-label">${label}</span><span class="cred-val">${escapeHtml(val)}</span>
    <button class="copy" onclick="copyVal(this,'${escapeAttr(val)}')">Copy</button></div>`;
}
function switchSession(containerId,idx,session){
  const badge=containerId==="heroCard"?(isToday(idx)?`<span class="badge">Today</span>`:`<span class="badge next">Next up</span>`):"";
  paintSession(containerId,idx,session,badge);
  if(containerId==="detailHero"){ detailSession=session; setHash(schedule[idx].iso,session); }
}
function openDetail(idx,session){
  lastFocus=document.activeElement; detailIdx=idx; detailSession=session||defaultSession();
  document.getElementById("homeView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("backBtn").style.display="inline-block";
  document.querySelector(".brand").textContent="Session Detail";
  paintSession("detailHero",idx,detailSession,"");
  setHash(schedule[idx].iso,detailSession);
  const t=document.getElementById("detailHero-title"); if(t) t.focus();
}
function showHome(){
  document.getElementById("detailView").style.display="none";
  document.getElementById("homeView").style.display="block";
  document.getElementById("backBtn").style.display="none";
  document.querySelector(".brand").textContent="Conference Hub";
  clearHash();
  if(lastFocus) lastFocus.focus();
}

/* deep-linking: #YYYY-MM-DD/AM|PM */
function parseHash(){
  const m=(location.hash||"").match(/^#(\d{4}-\d{2}-\d{2})\/(AM|PM)$/i);
  return m?{iso:m[1],session:m[2].toUpperCase()}:null;
}
function setHash(iso,session){ try{ history.replaceState(null,"",`#${iso}/${session}`); }catch(e){} }
function clearHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; } }
function applyDeepLink(){
  const h=parseHash(); if(!h) return;
  const idx=schedule.findIndex(s=>s.iso===h.iso);
  if(idx>=0) openDetail(idx,h.session);
}

/* ============================ IDENTITY ============================ */
function loadIdentity(){ try{ const v=store.get(ID_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function saveIdentity(o){ identity=o; store.set(ID_KEY,JSON.stringify(o)); refreshChip(); renderGreeting(); }
function refreshChip(){
  const av=document.getElementById("avatar"), lb=document.getElementById("idChipLabel");
  if(identity){ av.textContent=(firstToken(identity.first)[0]||"?").toUpperCase(); lb.textContent=firstToken(identity.first); }
  else { av.textContent="?"; lb.textContent="Set ID"; }
}

async function ensureRoster(){
  if(roster) return roster;
  if(CONFIG.roster.sheetId){
    try{
      const rows=parseGviz(await (await fetch(gvizUrl(CONFIG.roster.sheetId,CONFIG.roster.gid))).text());
      const c=CONFIG.roster.col;
      const list=rows.map(r=>({id:cell(r,c.id),last:cell(r,c.last),first:cell(r,c.first),role:cell(r,c.role).toUpperCase()}))
                     .filter(p=>["RES","FEL","ATT"].includes(p.role));
      if(list.length){ roster=list; rosterIsSample=false; return roster; }
    }catch(e){/* fall through to sample */}
  }
  roster=CONFIG.demoRoster.slice(); rosterIsSample=true; return roster;
}

let pendingEval=null;
function openIdentity(){
  lastFocus=document.activeElement; selectedRole=null;
  document.getElementById("idSub").textContent="Set your identity once to submit evaluations. Stored on this device only.";
  document.querySelectorAll(".role-chips button").forEach(b=>b.setAttribute("aria-pressed","false"));
  document.getElementById("idBody").innerHTML='<p class="name-empty">Pick your role to continue.</p>';
  document.getElementById("idOverlay").classList.add("open");
  ensureRoster();
  const c=document.querySelector(".role-chips button"); if(c) c.focus();
}
function closeIdentity(){ document.getElementById("idOverlay").classList.remove("open"); if(lastFocus) lastFocus.focus(); }

async function chooseRole(role){
  selectedRole=role;
  document.querySelectorAll(".role-chips button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.role===role)));
  const body=document.getElementById("idBody");
  if(role==="GUEST"){
    body.innerHTML=`
      <div class="row2">
        <div class="field"><label for="gFirst">First name</label><input id="gFirst" autocomplete="given-name"></div>
        <div class="field"><label for="gLast">Last name</label><input id="gLast" autocomplete="family-name"></div>
      </div>
      <div class="modal-btns"><button class="btn btn-primary" style="flex:1" onclick="saveGuest()">Continue as guest</button></div>`;
    const f=document.getElementById("gFirst"); if(f) f.focus();
    return;
  }
  // RES / FEL / ATT — name search; residents also get quick ID entry
  const idBlock = role==="RES" ? `
      <div class="id-quick">
        <div class="field"><label for="idInput">Resident ID</label><input id="idInput" inputmode="numeric" autocomplete="off" placeholder="e.g. 2701"></div>
        <button class="btn btn-primary" onclick="lookupById()">Find me</button>
      </div>
      <p class="lookup-msg err" id="lookupMsg" style="display:none"></p>
      <div class="divider">or search your name</div>` : "";
  body.innerHTML=`${idBlock}
      <input class="name-search" id="nameSearch" placeholder="Type your last name…" autocomplete="off" aria-label="Search by last name">
      <div class="name-results" id="nameResults"></div>
      ${role==="RES"?`<button class="btn btn-ghost" style="width:100%;margin-top:14px" onclick="residentFallback()">Can&rsquo;t find yourself? Continue as guest</button>`:""}`;
  const search=document.getElementById("nameSearch");
  search.oninput=filterNames;
  await ensureRoster();
  if(rosterIsSample){
    const note=document.createElement("div"); note.className="sample-note";
    note.textContent="Using the built-in sample roster — the live sheet couldn't be read from here.";
    body.insertBefore(note, body.firstChild);
  }
  filterNames();
  if(role!=="RES") search.focus();
}

function filterNames(){
  const box=document.getElementById("nameResults"); if(!box) return;
  const q=(document.getElementById("nameSearch").value||"").trim().toLowerCase();
  if(!roster){ box.innerHTML='<p class="name-empty">Loading roster…</p>'; return; }
  const all=roster.filter(p=>p.role===selectedRole && (!q || p.last.toLowerCase().includes(q)));
  currentResults=all.slice(0,100);
  if(!currentResults.length){
    box.innerHTML=`<p class="name-empty">${selectedRole==="FEL"?"No fellows in the roster yet.":"No matching names — check spelling or try Guest."}</p>`;
    return;
  }
  box.innerHTML=currentResults.map((p,i)=>
    `<button class="name-item" onclick="selectPerson(${i})"><span class="ln">${escapeHtml(p.last)},</span><span class="fn">${escapeHtml(p.first)}</span></button>`
  ).join("") + (all.length>currentResults.length?`<p class="name-empty">Showing first ${currentResults.length} — keep typing to narrow.</p>`:"");
}
function selectPerson(i){
  const p=currentResults[i]; if(!p) return;
  saveIdentity({type:"roster",id:p.id,first:p.first,last:p.last,role:p.role});
  afterIdentitySet();
}
function lookupById(){
  const id=document.getElementById("idInput").value.trim();
  const msg=document.getElementById("lookupMsg");
  if(!id) return;
  const matches=(roster||[]).filter(p=>p.role==="RES" && String(p.id)===id);
  if(matches.length===1){ saveIdentity({type:"roster",id:matches[0].id,first:matches[0].first,last:matches[0].last,role:"RES"}); afterIdentitySet(); return; }
  if(matches.length>1){ document.getElementById("nameSearch").value=""; filterNames(); msg.style.display="none"; return; }
  msg.style.display="block"; msg.textContent="ID not found. Try the name search below.";
}
function saveGuest(){
  const first=document.getElementById("gFirst").value.trim(), last=document.getElementById("gLast").value.trim();
  if(!first){ document.getElementById("gFirst").focus(); return; }
  saveIdentity({type:"guest",id:CONFIG.guestId,first,last,role:"GUEST"});
  afterIdentitySet();
}
function residentFallback(){
  const body=document.getElementById("idBody");
  body.innerHTML=`
    <p class="sub" style="margin:0 0 14px">Enter your name to continue as an unverified resident (ID ${CONFIG.residentGuestId}).</p>
    <div class="row2">
      <div class="field"><label for="rgFirst">First name</label><input id="rgFirst" autocomplete="given-name"></div>
      <div class="field"><label for="rgLast">Last name</label><input id="rgLast" autocomplete="family-name"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="chooseRole('RES')">← Back</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveResidentGuest()">Continue</button>
    </div>`;
  const f=document.getElementById("rgFirst"); if(f) f.focus();
}
function saveResidentGuest(){
  const first=document.getElementById("rgFirst").value.trim(), last=document.getElementById("rgLast").value.trim();
  if(!first){ document.getElementById("rgFirst").focus(); return; }
  saveIdentity({type:"guest",id:CONFIG.residentGuestId,first,last,role:"RES"});
  afterIdentitySet();
}
function afterIdentitySet(){ closeIdentity(); if(pendingEval){ const {idx,session}=pendingEval; pendingEval=null; startEval(idx,session); } }

/* ============================ EVALUATION ============================ */
function personKey(){
  if(!identity) return "anon";
  const base=identity.id||CONFIG.guestId;
  return `${base}~${(identity.last||"").toLowerCase()}~${firstToken(identity.first).toLowerCase()}`;
}
function evalRecordKey(iso,session){ return `${personKey()}|${iso}|${session}`; }
function readEvals(){
  try{
    const raw=JSON.parse(store.get(EVAL_KEY)||"{}");
    if(Array.isArray(raw)){ const m={}; raw.forEach(k=>m[k]=(m[k]||0)+1); return m; }  // migrate pre-3.3 array
    return (raw && typeof raw==="object") ? raw : {};
  }catch(e){ return {}; }
}
function writeEvals(m){ try{ store.set(EVAL_KEY,JSON.stringify(m)); }catch(e){} }
function openedCount(iso,session){ return readEvals()[evalRecordKey(iso,session)]||0; }
function markOpened(iso,session){ const m=readEvals(), k=evalRecordKey(iso,session); m[k]=(m[k]||0)+1; writeEvals(m); }

/* Human-readable field object (drives preview + the packed Details string). */
function buildReadableFields(idx,session){
  const day=schedule[idx], data=day[session];
  return {
    name:`${identity.first} ${identity.last}`.trim(),
    role:identity.role,
    location:evalLocation||"",
    title:data.title,
    date:day.stampFull,
    session,
    sessionKey:`${day.iso}|${session}`,
    identityType:identity.type,
    evaluatorId:identity.id,
    device:DEVICE
  };
}
function packDetails(rf){ return CONFIG.packOrder.map(k=>rf[k]!=null?rf[k]:"").join(CONFIG.packDelim); }
/* Only three fields go to the form now: rating, comment, details(packed). */
function buildSubmitFields(){
  return { rating:evalRating, comment:evalComment, details:packDetails(buildReadableFields(evalCtx.idx,evalCtx.session)) };
}
function buildPrefillUrl(sf){
  const e=CONFIG.eval.entry, p=new URLSearchParams({usp:"pp_url"});
  ["rating","comment","details"].forEach(k=>{ if(sf[k]!=null&&sf[k]!=="") p.append(e[k],sf[k]); });
  return `${CONFIG.eval.formBase}?${p.toString()}`;
}
function currentEvalUrl(){
  const sf=buildSubmitFields();
  if(CONFIG.eval.formBase) return buildPrefillUrl(sf);
  return "https://docs.google.com/forms/…/viewform?"+new URLSearchParams({usp:"pp_url",
    "entry.RATING":sf.rating||"", "entry.COMMENT":sf.comment||"", "entry.DETAILS":sf.details}).toString();
}

const EVAL_READABLE=[["name","Name"],["role","Role"],["title","Lecture title"],["date","Date"],["session","Session"],["location","Location"]];
const EVAL_META=[["sessionKey","Session key"],["identityType","Identity type"],["evaluatorId","Evaluator ID"],["device","Device"]];
let evalCtx=null, evalLocation="", evalRating="", evalComment="";

function metaRowHtml(key,label,rf){
  const v=(key==="location")?(rf.location||"—"):(rf[key]===""?"—":rf[key]);
  return `<div class="map-row"><div class="map-k">${label}</div><div class="map-v">${escapeHtml(v)}</div></div>`;
}

function startEval(idx,session){
  if(!identity){
    pendingEval={idx,session}; openIdentity();
    document.getElementById("idSub").textContent="Set your identity to submit an evaluation.";
    return;
  }
  evalCtx={idx,session}; evalLocation=""; evalRating=""; evalComment="";   // start blank every open
  const rf=buildReadableFields(idx,session);
  const configured=!!CONFIG.eval.formBase;
  const detailsReady=!/TODO/.test(CONFIG.eval.entry.details||"");
  document.getElementById("evalSub").textContent=`${rf.title} — ${rf.date} ${rf.session}`;

  const rateBtns=[1,2,3,4,5].map(n=>
    `<button class="rate-opt" role="radio" aria-checked="false" data-val="${n}" onclick="selectRating(${n})">${n}</button>`
  ).join("");
  const locBtns=CONFIG.locations.map(v=>
    `<button class="loc-opt" role="radio" aria-checked="false" data-val="${escapeAttr(v)}" onclick="selectLocation('${escapeAttr(v)}')">${escapeHtml(v)}</button>`
  ).join("");
  const metaRows=EVAL_READABLE.concat(EVAL_META).map(([k,l])=>metaRowHtml(k,l,rf)).join("");
  const openLabel=configured?"Open form to submit ↗":"Simulate submission (preview)";

  document.getElementById("evalBody").innerHTML=`
    <div class="loc-block">
      <p class="loc-q">Your rating<span class="req">Required</span></p>
      <div class="rate-scale" role="radiogroup" aria-label="Overall rating 1 to 5">${rateBtns}</div>
      <div class="rate-anchors"><span>Poor</span><span>Excellent</span></div>
    </div>
    <div class="loc-block">
      <p class="loc-q">Where are you attending from?<span class="req">Required</span></p>
      <div class="loc-group" role="radiogroup" aria-label="Attendance location">${locBtns}</div>
    </div>
    <div class="loc-block">
      <p class="loc-q">Comments<span style="color:var(--ink-2);font-weight:600;text-transform:none;letter-spacing:0">Optional</span></p>
      <textarea id="evalComment" class="eval-comment" rows="3" placeholder="What worked, what could improve…" oninput="onCommentInput(this.value)"></textarea>
    </div>
    ${configured?"":`<div class="demo-note"><b>Preview mode.</b> No Google Form wired — “Simulate submission” just records an open so you can test the indicator.</div>`}
    ${(configured&&!detailsReady)?`<div class="demo-note"><b>Almost live.</b> The packed <b>Details</b> field ID isn't set yet, so rating & comment will prefill but session metadata won't. Paste the Details <code>entry</code> ID into <b>CONFIG.eval</b> to finish.</div>`:""}
    <details class="meta-details"><summary>What gets submitted</summary><div class="map-table nested">${metaRows}</div></details>
    <details class="url-details"><summary>Prefill URL${configured?"":" (placeholder IDs)"}</summary><div class="url-box" id="evUrlBox">— set rating & location —</div></details>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeEval()">Cancel</button>
      <button class="btn btn-primary" id="openFormBtn" style="flex:1" disabled onclick="submitEval()">${openLabel}</button>
    </div>`;
  lastFocus=document.activeElement;
  document.getElementById("evalOverlay").classList.add("open");
  const firstRate=document.querySelector(".rate-opt"); if(firstRate) firstRate.focus();
}
function refreshEvalGate(){
  const btn=document.getElementById("openFormBtn"); if(btn) btn.disabled=!(evalRating&&evalLocation);
  const box=document.getElementById("evUrlBox");
  if(box) box.textContent=(evalRating&&evalLocation)?currentEvalUrl():"— set rating & location —";
}
function selectRating(n){
  evalRating=String(n);
  document.querySelectorAll(".rate-opt").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.val===n)));
  refreshEvalGate();
}
function selectLocation(value){
  evalLocation=value;
  document.querySelectorAll(".loc-opt").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.val===value)));
  refreshEvalGate();
}
function onCommentInput(v){ evalComment=v; if(evalRating&&evalLocation){ const box=document.getElementById("evUrlBox"); if(box) box.textContent=currentEvalUrl(); } }
function submitEval(){
  if(!evalRating || !evalLocation || !evalCtx) return;
  const {idx,session}=evalCtx, iso=schedule[idx].iso;
  if(CONFIG.eval.formBase) window.open(currentEvalUrl(),"_blank","noopener");
  markOpened(iso,session);
  closeEval();
  if(document.getElementById("detailView").style.display==="block") paintSession("detailHero",detailIdx,detailSession,"");
  else renderHero();
}
function closeEval(){ document.getElementById("evalOverlay").classList.remove("open"); if(lastFocus) lastFocus.focus(); }

/* ============================ UTIL ============================ */
function copyVal(btn,val){
  const orig=btn.dataset.label||btn.textContent; btn.dataset.label=orig;
  const done=()=>{ btn.textContent="Copied ✓"; btn.classList.add("copied"); setTimeout(()=>{ btn.textContent=orig; btn.classList.remove("copied"); },1400); };
  if(navigator.clipboard) navigator.clipboard.writeText(val).then(done,done); else done();
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,"&quot;"); }

["idOverlay","evalOverlay"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{
    if(e.target.id===id){
      if(id==="idOverlay") pendingEval=null;   // abandoned identity → don't auto-fire a queued eval later
      e.target.classList.remove("open");
      if(lastFocus) lastFocus.focus();
    }
  });
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    const open=document.querySelectorAll(".overlay.open");
    if(!open.length) return;
    if(document.getElementById("idOverlay").classList.contains("open")) pendingEval=null;
    open.forEach(o=>o.classList.remove("open"));
    if(lastFocus) lastFocus.focus();
  }
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Tab") return;
  const sheet=document.querySelector(".overlay.open .sheet"); if(!sheet) return;
  const f=[...sheet.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
window.addEventListener("hashchange",()=>{
  if(!schedule.length) return;
  const h=parseHash();
  if(h){ applyDeepLink(); }
  else if(document.getElementById("detailView").style.display==="block"){ showHome(); }
});

refreshChip(); init();
</script>
</body>
</html>
